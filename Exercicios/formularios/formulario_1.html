<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulário 1</title>
</head>
<body>
<h2 style="color: darkred; text-align: center"> Envie um e-mail💖</h2>

<form action="" method="post">
    <div style="text-align: center;">
        <label style="color: indianred">
            Nome:
            <input name="form_nome" type="text" placeholder="Digite seu nome" required>
        </label>
        <br>
        <br>
        <label style="color: indianred">
            E-mail:
            <input name="form_email" type="email" placeholder="Digite o e-mail destinatário" required>
        </label>
        <br>
        <br>
        <label style="color: indianred">
            Assunto:
            <input name="form_assunto" type="text" placeholder="Digite o assunto do e-mail">
        </label>
        <br>
        <br>
        <label style="color: indianred">
            Mensagem:
            <br>
            <textarea name="form_mensagem" rows="10" cols="50" placeholder="Deixe sua mensagem ao destinatário" required></textarea>
        </label>
        <br>
        <br>
        <button type="submit" style="color: darkred">Enviar</button>
        <button type="reset" style="color: darkred">Redefinir</button>
    </div>
</form>
</body>
</html>
