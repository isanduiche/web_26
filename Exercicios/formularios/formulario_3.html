<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulário 3</title>
</head>
<body>
<div>
    <h2 style="color: darkblue; text-align: center"> Pesquisa de satisfação do cliente </h2>
</div>
<form action="" method="post">
    <label style="color: darkblue">
        Nome completo:
        <input name="form_nome" type="text" placeholder="Digite seu nome completo" required>
    </label>
    <br>
    <br>
    <label style="color: darkblue">
        Empresa:
        <input name="form_empresa" type="text" placeholder="Digite o nome da empresa" required>
    </label>
    <br>
    <br>
    <label style="color: darkblue"> Idade:</label>
    <label>
        <input name="form_idade" value="1" type="radio" required>
        10-20 anos
    </label>
    <label>
        <input name="form_idade" value="2" type="radio" required>
        20-30 anos
    </label>
    <label>
        <input name="form_idade" value="3" type="radio" required>
        30-50 anos
    </label>
    <label>
        <input name="form_idade" value="3" type="radio" required>
        50-80 anos
    </label>
    <br>
    <br>
    <label style="color: darkblue">
        E-mail:
        <input name="form_email" type="email" placeholder="Digite seu e-mail" required>
    </label>
    <br>
    <br>
    <label style="color: darkblue">
        Telefone Comercial:
        <input name="form_telefone" type="text" placeholder="EX: 18-3606-4244" required>
    </label>
    <label style="color: darkblue">
        Celular:
        <input name="form_celular" type="text" placeholder="EX: 18-99204-1578" required>
    </label>
    <br>
    <br>
    <label style="color: darkblue"> Como você avalia os nossos serviços atualmente?</label>
    <br>
    <label>
        <input name="form_avaliacao" value="1" type="radio" required>
        REGULAR
    </label>
    <label>
        <input name="form_avaliacao" value="2" type="radio" required>
        BOM
    </label>
    <label>
        <input name="form_avaliacao" value="3" type="radio" required>
        EXCELENTE
    </label>
    <br>
    <br>
    <label style="color: darkblue"> Como você avalia os serviços na área operacional?</label>
    <br>
    <label>
        <input name="form_avaliacao_operacional" value="1" type="radio" required>
        REGULAR
    </label>
    <label>
        <input name="form_avaliacao_operacional" value="2" type="radio" required>
        BOM
    </label>
    <label>
        <input name="form_avaliacao_operacional" value="3" type="radio" required>
        EXCELENTE
    </label>
    <br>
    <br>
    <label style="color: darkblue"> Qual o nível de satisfação com o atendimento administrativo quando você precisa?</label>
    <br>
    <label>
        <input name="form_avaliacao_administrativa" value="1" type="radio" required>
        POUCO SATISFATÓRIO
    </label>
    <label>
        <input name="form_avaliacao_administrativa" value="2" type="radio" required>
        SATISFATÓRIO
    </label>
    <label>
        <input name="form_avaliacao_administrativa" value="3" type="radio" required>
        MUITO SATISFATÓRIO
    </label>
    <br>
    <br>
    <label style="color: darkblue">
        Você tem alguma sugestão ou crítica a fazer para cada vez mais melhorarmos nossos serviços?
        <br>
        <textarea name="form_sugestao" rows="10" cols="50" placeholder="Deixe sua segustão ou crítica" required></textarea>
        </label>
        <br>
        <br>
    <button type="submit" style="color: darkblue">Enviar</button>
    <button type="reset" style="color: darkblue">Redefinir</button>
</form>
</body>
</html>
